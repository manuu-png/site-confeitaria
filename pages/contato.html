<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>

    <link rel="stylesheet" href="../css/contato.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="div-logo">
            <img class="logotipo" src="../img/logo.png.png" alt="logotipo da confeitaria">
        </div>

        <div class="div-menu">
            <h1>Confeitaria Sempre Doce</h1>

            <nav>
                <ul>
                    <li><a href="../index.html">início</a></li>
                    <li><a href="sobre.html">sobre</a></li>
                    <li><a href="cardapio.html">cardápio</a></li>
                    <li><a href="contato.html">contato</a></li>
                </ul>
            </nav>
        </div>

        <div class="div-logo"></div>
    </header>

    <h1>formulário de cadastro dos clientes</h1>

    <form>

        <div class="container">

            <fieldset>
                <legend>dados do cliente</legend>

                <div>
                    <label>primeiro nome:</label>
                    <input type="text">
                </div>

                <div>
                    <label>último nome:</label>
                    <input type="text">
                </div>

                <div>
                    <label>telefone:</label>
                    <input type="tel">
                </div>

                <div>
                    <label>whatsapp:</label>
                    <input type="checkbox" class="checkbox">
                </div>
            </fieldset>

            <fieldset>
                <legend>informações do pedido</legend>

                <div>
                    <label>item:</label>
                    <select id="item">
                        <option value="50">bolo red velvet</option>
                        <option value="45">bolo de cereja</option>
                        <option value="35">bolo de morango</option>
                        <option value="40">bolo de ninho</option>
                        <option value="55">bolo arco iris</option>
                        <option value="30">bolo de chocolate</option>
                    </select>
                </div>

                <div>
                    <label>forma de pagamento:</label>
                    <select>
                        <option value="">selecione</option>
                        <option value="pix">pix</option>
                        <option value="credito">cartão de crédito</option>
                        <option value="debito">cartão de débito</option>
                        <option value="dinheiro">dinheiro</option>
                    </select>
                </div>

                <div>
                    <label>quantidade:</label>
                    <input type="number" id="quantidade" min="1" max="20">
                </div>

                <div>
                    <label>total:</label>
                    <input type="text" id="total" readonly>
                </div>

                <button type="button" onclick="calcularTotal()">
                    calcular total
                </button>
            </fieldset>

        </div>

        <div class="container">

            <fieldset>
                <legend>dados do endereço</legend>

                <div>
                    <label>CEP:</label>
                    <input onkeydown="buscar(event)" id="cep" type="text"
                        placeholder="digite e aperte enter para buscar">
                </div>

                <div>
                    <label>logradouro:</label>
                    <input id="logradouro" type="text">
                </div>

                <div>
                    <label>número:</label>
                    <input type="number">
                </div>

                <div>
                    <label>bairro:</label>
                    <input id="bairro" type="text">
                </div>

                <div>
                    <label>cidade:</label>
                    <input id="cidade" type="text">
                </div>

                <div>
                    <label>estado:</label>
                    <input id="estado" type="text">
                </div>

                <div>
                    <label>UF:</label>
                    <input id="uf" type="text">
                </div>
            </fieldset>

        </div>

        <div class="container botoes">
            <button type="submit" onclick="cadastrar(event)">
                cadastrar informações
            </button>

            <button type="reset">
                limpar formulário
            </button>
        </div>

    </form>

    <script src="../js/contato.js"></script>

</body>

</html>
